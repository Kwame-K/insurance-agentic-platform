services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-platform_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      EXTRACTOR_DB_PASSWORD: ${EXTRACTOR_DB_PASSWORD:?Set EXTRACTOR_DB_PASSWORD in .env}
      UNDERWRITING_DB_PASSWORD: ${UNDERWRITING_DB_PASSWORD:?Set UNDERWRITING_DB_PASSWORD in .env}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?Set KNOWLEDGE_DB_PASSWORD in .env}
      ANALYST_DB_PASSWORD: ${ANALYST_DB_PASSWORD:?Set ANALYST_DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  data-analyst-agent:
    build:
      context: ../insurance-data-analyst-agent
      dockerfile: Dockerfile
    image: insurance-data-analyst-agent:platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://analyst_app:${ANALYST_DB_PASSWORD}@postgres:5432/analyst
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8003:8003"
    volumes:
      - analyst_output:/app/output
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  submission-extractor:
    build:
      context: ../insurance-submission-extractor
      dockerfile: Dockerfile
    image: insurance-submission-extractor:platform
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_MAX_RETRIES: ${GROQ_MAX_RETRIES:-3}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      DATABASE_URL: postgresql://extractor_app:${EXTRACTOR_DB_PASSWORD}@postgres:5432/extractor
      DATABASE_AUTO_MIGRATE: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped

  knowledge-agent:
    build:
      context: ../insurance-rag-assistant
      dockerfile: Dockerfile
    image: insurance-rag-assistant:platform
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-openai/gpt-oss-20b}
      HF_HOME: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
    ports:
      - "8001:8001"
    volumes:
      - rag_vector_store:/app/vector_store
      - rag_artifacts:/app/artifacts
      - rag_model_cache:/app/.cache
    restart: unless-stopped

  underwriting-agent:
    build:
      context: ../underwriting-agent
      dockerfile: Dockerfile
    image: underwriting-agent:platform
    depends_on:
      postgres:
        condition: service_healthy
      submission-extractor:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://underwriting_app:${UNDERWRITING_DB_PASSWORD}@postgres:5432/underwriting
      SUBMISSION_EXTRACTOR_BASE_URL: http://submission-extractor:8000
      SUBMISSION_EXTRACTOR_TIMEOUT_SECONDS: ${SUBMISSION_EXTRACTOR_TIMEOUT_SECONDS:-30}
      KNOWLEDGE_AGENT_BASE_URL: http://knowledge-agent:8001
      KNOWLEDGE_AGENT_TIMEOUT_SECONDS: ${KNOWLEDGE_AGENT_TIMEOUT_SECONDS:-10}
      PORTFOLIO_ANALYST_BASE_URL: http://data-analyst-agent:8003
      PORTFOLIO_ANALYST_TIMEOUT_SECONDS: ${PORTFOLIO_ANALYST_TIMEOUT_SECONDS:-30}
    ports:
      - "8002:8002"
    restart: unless-stopped

  email-intake:
    build:
      context: ../insurance-email-intake
      dockerfile: Dockerfile
    image: insurance-email-intake:platform
    depends_on:
      underwriting-agent:
        condition: service_started
    environment:
      UNDERWRITING_BASE_URL: http://underwriting-agent:8002
      UNDERWRITING_TIMEOUT_SECONDS: ${EMAIL_INTAKE_TIMEOUT_SECONDS:-120}
      INBOX_DIR: /app/data/inbox
      STATE_DIR: /app/data/state
      WATCH_ENABLED: "true"
      WATCH_INTERVAL_SECONDS: "10"
      IMAP_ENABLED: ${IMAP_ENABLED:-false}
      IMAP_HOST: ${IMAP_HOST:-imap.gmail.com}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      IMAP_POLL_INTERVAL_SECONDS: ${IMAP_POLL_INTERVAL_SECONDS:-30}
      IMAP_ALLOWED_SENDERS: ${IMAP_ALLOWED_SENDERS:-}
      SMTP_REPLY_ENABLED: ${SMTP_REPLY_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      REPLY_LANGUAGE: ${REPLY_LANGUAGE:-en}


    ports:
      - "8004:8004"
    volumes:
      - ../insurance-email-intake/data/inbox:/app/data/inbox:ro
      - email_intake_state:/app/data/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped


  underwriting-ui:
    build:
      context: ../insurance-underwriting-ui
      dockerfile: Dockerfile
    image: insurance-underwriting-ui:platform
    depends_on:
      email-intake:
        condition: service_healthy
      underwriting-agent:
        condition: service_started
    environment:
      SUBMISSION_EXTRACTOR_BASE_URL: "http://submission-extractor:8000"
      DATA_ANALYST_BASE_URL: "http://data-analyst-agent:8003"
      KNOWLEDGE_AGENT_BASE_URL: "http://knowledge-agent:8001"
      INTAKE_BASE_URL: http://email-intake:8004
      UNDERWRITING_BASE_URL: http://underwriting-agent:8002
      REQUEST_TIMEOUT_SECONDS: ${UI_REQUEST_TIMEOUT_SECONDS:-120}
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped



volumes:
  postgres_data:
  rag_vector_store:
  rag_artifacts:
  rag_model_cache:
  analyst_output:
  email_intake_state:
